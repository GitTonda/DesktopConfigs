# ==============================================================================
# Linux Desktop & ZRAM Performance Tuning
# ==============================================================================

# ZRAM & Memory Swapping
# Aggressively prefer ultra-fast in-RAM ZRAM compression over dropping disk cache
vm.swappiness = 180
vm.page-cluster = 0
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125

# VFS Cache Pressure: keep directory and inode caches longer in RAM (faster git, fzf, file managers)
vm.vfs_cache_pressure = 50

# Dirty Memory Writeback: smooth out disk writes and prevent UI micro-stutters
vm.dirty_ratio = 10
vm.dirty_background_ratio = 5

# File System Watchers (prevent IDEs, Vite, dev servers, or tools from exhausting limits)
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 1024
