  <circle cx="256" cy="256" r="125" stroke="#89b4fa" stroke-width="4" stroke-dasharray="24 12" opacity="0.4" />

  <line x1="256" y1="96" x2="256" y2="156" stroke="#89b4fa" stroke-width="4" stroke-linecap="round" />
  <line x1="256" y1="416" x2="256" y2="356" stroke="#89b4fa" stroke-width="4" stroke-linecap="round" />
  <line x1="96" y1="256" x2="156" y2="256" stroke="#89b4fa" stroke-width="4" stroke-linecap="round" />
  <line x1="416" y1="256" x2="356" y2="256" stroke="#89b4fa" stroke-width="4" stroke-linecap="round" />

  <circle cx="256" cy="96" r="10" fill="#89b4fa" filter="url(#glow)" />
  <circle cx="256" cy="416" r="10" fill="#2977af" />
  <circle cx="96" cy="256" r="10" fill="#2977af" />
