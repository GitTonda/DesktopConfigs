; ==============================================================================
; Polybar Configuration - Catppuccin Mocha Minimal
; ==============================================================================

[colors]
base = #1e1e2e
mantle = #181825
crust = #11111b
text = #cdd6f4
subtext = #a6adc8
surface0 = #313244
surface1 = #45475a
blue = #89b4fa
lavender = #cba6f7
green = #a6e3a1
yellow = #f9e2af
red = #f38ba8
peach = #fab387
teal = #94e2d5

[bar/main]
width = 100%
height = 30pt
radius = 0

background = ${colors.crust}
foreground = ${colors.text}

line-size = 2pt

border-size = 0pt
border-color = #00000000

padding-left = 1
padding-right = 2

module-margin = 1

separator = |
separator-foreground = ${colors.surface1}

font-0 = "JetBrainsMono Nerd Font:size=10;3"
font-1 = "JetBrainsMono Nerd Font:style=Bold:size=10;3"

modules-left = i3 xwindow
modules-right = cpu memory pulseaudio wlan eth ${env:HAS_BATTERY:} date tray powermenu

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

wm-restack = i3

; ==============================================================================
; Modules
; ==============================================================================

[module/i3]
type = internal/i3
pin-workspaces = true
show-urgent = true
strip-wsnumbers = true
index-sort = true
enable-click = true
enable-scroll = false

label-focused = %name%
label-focused-foreground = ${colors.blue}
label-focused-background = ${colors.surface0}
label-focused-underline = ${colors.blue}
label-focused-padding = 2

label-unfocused = %name%
label-unfocused-foreground = ${colors.subtext}
label-unfocused-padding = 2

label-visible = %name%
label-visible-underline = ${colors.surface1}
label-visible-padding = 2

label-urgent = %name%
label-urgent-foreground = ${colors.red}
label-urgent-padding = 2

[module/xwindow]
type = internal/xwindow
label = %title:0:50:...%
label-foreground = ${colors.subtext}

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "CPU "
format-prefix-foreground = ${colors.peach}
label = %percentage:2%%

[module/memory]
type = internal/memory
interval = 2
format-prefix = "RAM "
format-prefix-foreground = ${colors.teal}
label = %percentage_used:2%%

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = false

format-volume = <label-volume>
format-volume-prefix = "VOL "
format-volume-prefix-foreground = ${colors.lavender}
label-volume = %percentage%%

label-muted = "MUTED"
label-muted-foreground = ${colors.red}

[module/wlan]
type = internal/network
interface-type = wireless
interval = 3.0

format-connected = <label-connected>
format-connected-prefix = "WIFI "
format-connected-prefix-foreground = ${colors.green}
label-connected = %essid%

format-disconnected = ""

[module/eth]
type = internal/network
interface-type = wired
interval = 3.0

format-connected = <label-connected>
format-connected-prefix = "ETH "
format-connected-prefix-foreground = ${colors.green}
label-connected = connected

format-disconnected = ""

[module/battery]
type = internal/battery
full-at = 99
low-at = 15
battery = BAT0
adapter = AC
poll-interval = 5

format-charging = <label-charging>
format-charging-prefix = "BAT "
format-charging-prefix-foreground = ${colors.green}
label-charging = %percentage%%+

format-discharging = <label-discharging>
format-discharging-prefix = "BAT "
format-discharging-prefix-foreground = ${colors.yellow}
label-discharging = %percentage%%

format-full = <label-full>
format-full-prefix = "BAT "
format-full-prefix-foreground = ${colors.green}
label-full = 100%

format-low = <label-low>
format-low-prefix = "BAT "
format-low-prefix-foreground = ${colors.red}
label-low = %percentage%%!

[module/date]
type = internal/date
interval = 1

date = %H:%M
date-alt = %A, %d %b %Y  %H:%M:%S

label = %date%
label-foreground = ${colors.blue}

[module/tray]
type = internal/tray
tray-spacing = 8px
tray-size = 16px

[module/powermenu]
type = custom/text
label = "  "
label-foreground = ${colors.red}
click-left = ~/.config/rofi/powermenu.sh

[settings]
screenchange-reload = true
pseudo-transparency = true
