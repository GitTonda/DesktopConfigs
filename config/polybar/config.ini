; ==============================================================================
; Polybar Configuration - Catppuccin Mocha Minimal (Refined Applets)
; ==============================================================================

[colors]
base = #1e1e2e
mantle = #181825
crust = #11111b
text = #cdd6f4
subtext = #a6adc8
surface0 = #313244
surface1 = #45475a
blue = #89b4fa
lavender = #cba6f7
green = #a6e3a1
yellow = #f9e2af
red = #f38ba8
peach = #fab387

teal = #94e2d5

; Dynamic theme colors from wallpaper
include-file = ~/.config/polybar/colors.ini

[bar/main]
width = 100%
height = 28pt
radius = 0

background = ${colors.crust}
foreground = ${colors.text}

line-size = 2pt

border-size = 0pt
border-color = #00000000

padding-left = 1
padding-right = 1

module-margin = 1

separator = ""

font-0 = "JetBrainsMono Nerd Font:size=10;3"
font-1 = "JetBrainsMono Nerd Font:style=Bold:size=10;3"
font-2 = "JetBrainsMono Nerd Font:size=11;3"

modules-left = i3 xwindow
modules-right = cpu memory gpu pulseaudio bluetooth wlan eth battery date tray powermenu

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

; ==============================================================================
; Modules - Left
; ==============================================================================

[module/i3]
type = internal/i3
pin-workspaces = true
show-urgent = true
strip-wsnumbers = true
index-sort = true
enable-click = true
enable-scroll = false

label-focused = %name%
label-focused-foreground = ${colors.accent}
label-focused-background = ${colors.surface0}
label-focused-underline = ${colors.accent}
label-focused-padding = 2

label-unfocused = %name%
label-unfocused-foreground = ${colors.subtext}
label-unfocused-padding = 2

label-visible = %name%
label-visible-underline = ${colors.surface1}
label-visible-padding = 2

label-urgent = %name%
label-urgent-foreground = ${colors.red}
label-urgent-padding = 2

[module/xwindow]
type = internal/xwindow
label = %title:0:45:...%
label-foreground = ${colors.subtext}
format-padding = 1

; ==============================================================================
; Modules - Right (Interactive Applets with Explicit Action Tags)
; ==============================================================================

[module/cpu]
type = internal/cpu
interval = 2
format = <label>
format-prefix = "󰍛 "
format-prefix-foreground = ${colors.peach}
format-padding = 1
label = "%{A1:alacritty --class FloatingBtop -e btop:}%{A3:alacritty --class FloatingBtop -e btop:}%percentage:2%%%{A}%{A}"
label-foreground = ${colors.text}

[module/memory]
type = internal/memory
interval = 2
format = <label>
format-prefix = "󰘚 "
format-prefix-foreground = ${colors.teal}
format-padding = 1
label = "%{A1:alacritty --class FloatingBtop -e btop:}%{A3:alacritty --class FloatingBtop -e btop:}%percentage_used:2%%%{A}%{A}"
label-foreground = ${colors.text}

[module/gpu]
type = custom/script
exec = ~/.config/polybar/scripts/gpu.sh
interval = 2
format = <label>
format-padding = 1
label = %output%
click-left = alacritty --class FloatingGPU -e ~/.config/polybar/scripts/gpu-top.sh &
click-middle = ~/.config/polybar/scripts/gpu.sh --notify &
click-right = ~/.config/polybar/scripts/gpu.sh --toggle-mode &
scroll-up = ~/.config/polybar/scripts/gpu.sh --next-mode &
scroll-down = ~/.config/polybar/scripts/gpu.sh --prev-mode &

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = false

format-volume = "%{A1:pactl set-sink-mute @DEFAULT_SINK@ toggle:}%{A3:alacritty --class FloatingAudio -e alsamixer:}<ramp-volume> <label-volume>%{A}%{A}"
format-volume-padding = 1
ramp-volume-0 = "󰕿"
ramp-volume-1 = "󰖀"
ramp-volume-2 = "󰕾"
ramp-volume-foreground = ${colors.lavender}
label-volume = %percentage%%
label-volume-foreground = ${colors.text}

format-muted = "%{A1:pactl set-sink-mute @DEFAULT_SINK@ toggle:}%{A3:alacritty --class FloatingAudio -e alsamixer:}<label-muted>%{A}%{A}"
format-muted-padding = 1
format-muted-prefix = "󰝟 "
format-muted-prefix-foreground = ${colors.red}
label-muted = "muted"
label-muted-foreground = ${colors.subtext}

scroll-up = ~/.config/dunst/scripts/volume-osd.sh up
scroll-down = ~/.config/dunst/scripts/volume-osd.sh down

[module/bluetooth]
type = custom/script
exec = ~/.config/polybar/scripts/bluetooth.sh
interval = 2
click-left = ~/.config/rofi/bluetooth.sh &
click-right = ~/.config/polybar/scripts/bluetooth.sh --toggle &
click-middle = ~/.config/rofi/bluetooth.py --customize &
format = <label>
format-padding = 1
label = "%output%"

[module/wlan]
type = internal/network
interface-type = wireless
interval = 3.0

format-connected = "%{A1:~/.config/rofi/wifi.sh:}%{A3:alacritty --class FloatingWifi -e nmtui:}<ramp-signal> <label-connected>%{A}%{A}"
format-connected-padding = 1
ramp-signal-0 = "󰤟"
ramp-signal-1 = "󰤢"
ramp-signal-2 = "󰤥"
ramp-signal-3 = "󰤨"
ramp-signal-foreground = ${colors.green}
label-connected = %essid:0:18:...%
label-connected-foreground = ${colors.text}

format-disconnected = "%{A1:~/.config/rofi/wifi.sh:}%{A3:alacritty --class FloatingWifi -e nmtui:}<label-disconnected>%{A}%{A}"
format-disconnected-padding = 1
format-disconnected-prefix = "󰤮 "
format-disconnected-prefix-foreground = ${colors.subtext}
label-disconnected = "offline"
label-disconnected-foreground = ${colors.subtext}

[module/eth]
type = internal/network
interface-type = wired
interval = 3.0

format-connected = "%{A1:alacritty --class FloatingWifi -e nmtui:}%{A3:alacritty --class FloatingWifi -e nmtui:}<label-connected>%{A}%{A}"
format-connected-padding = 1
format-connected-prefix = "󰈀 "
format-connected-prefix-foreground = ${colors.green}
label-connected = wired
label-connected-foreground = ${colors.text}

format-disconnected = ""

[module/battery]
type = internal/battery
full-at = 99
low-at = 15
battery = ${env:POLYBAR_BATTERY:BAT0}
adapter = ${env:POLYBAR_ADAPTER:AC}
poll-interval = 5

format-charging = <animation-charging> <label-charging>
format-charging-padding = 1
animation-charging-0 = "󰂆"
animation-charging-1 = "󰂈"
animation-charging-2 = "󰂉"
animation-charging-3 = "󰂄"
animation-charging-foreground = ${colors.green}
animation-charging-framerate = 750
label-charging = %percentage%%

format-discharging = <ramp-capacity> <label-discharging>
format-discharging-padding = 1
ramp-capacity-0 = "󰂎"
ramp-capacity-1 = "󰁺"
ramp-capacity-2 = "󰁻"
ramp-capacity-3 = "󰁼"
ramp-capacity-4 = "󰁽"
ramp-capacity-5 = "󰁾"
ramp-capacity-6 = "󰁿"
ramp-capacity-7 = "󰂀"
ramp-capacity-8 = "󰂁"
ramp-capacity-9 = "󰂂"
ramp-capacity-10 = "󰁹"
ramp-capacity-foreground = ${colors.yellow}
label-discharging = %percentage%%

format-full = <label-full>
format-full-padding = 1
format-full-prefix = "󰁹 "
format-full-prefix-foreground = ${colors.green}
label-full = 100%

format-low = <label-low>
format-low-padding = 1
format-low-prefix = "󰂎 "
format-low-prefix-foreground = ${colors.red}
label-low = %percentage%%!

[module/date]
type = internal/date
interval = 1

date = %a %d %b  %H:%M
date-alt = %A, %d %B %Y  %H:%M:%S

format = "%{A1:~/.config/polybar/scripts/calendar.sh:}%{A3:~/.config/polybar/scripts/calendar.sh:}<label>%{A}%{A}"
format-padding = 1
format-prefix = "󰃭 "
format-prefix-foreground = ${colors.accent}
label = %date%
label-foreground = ${colors.text}

[module/tray]
type = internal/tray
tray-spacing = 6px
tray-size = 15px
tray-padding = 2px

[module/powermenu]
type = custom/text
label = " 󰐥 "
label-foreground = ${colors.red}
label-padding = 1
click-left = ~/.config/rofi/powermenu.sh
click-right = ~/.config/rofi/powermenu.sh

[settings]
screenchange-reload = true
pseudo-transparency = true
