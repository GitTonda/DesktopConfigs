# Gaming Environment Optimizations

# NVIDIA Shader Cache (Prevents shader eviction and compilation stutters)
__GL_SHADER_DISK_CACHE=1
__GL_SHADER_DISK_CACHE_SKIP_CLEANUP=1
__GL_SHADER_DISK_CACHE_SIZE=10737418240

# Proton NVAPI & NVIDIA DLSS / Reflex Support
PROTON_ENABLE_NVAPI=1
PROTON_HIDE_NVIDIA_GPU=0

# VKD3D-Proton Resizable BAR Optimization (Direct host-visible VRAM uploads)
VKD3D_CONFIG=upload_hvv,force_static_cbv,force_host_cached

# Proton System Call Optimization
PROTON_USE_SECCOMP=0
DXVK_CONFIG_FILE=${HOME}/.config/dxvk/dxvk.conf
