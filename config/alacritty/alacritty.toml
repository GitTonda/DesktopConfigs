# ==============================================================================
# Alacritty Configuration - Catppuccin Mocha Minimal
# ==============================================================================

[window]
padding = { x = 10, y = 10 }
dynamic_padding = true
opacity = 0.94
blur = true

[font]
size = 10.0

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

# ==============================================================================
# Catppuccin Mocha Colorway
# ==============================================================================
[colors.primary]
background = "#111317"
foreground = "#cdd6f4"
dim_foreground = "#7f849c"
bright_foreground = "#cdd6f4"

[colors.cursor]
text = "#111317"
cursor = "#89b4fa"

[colors.vi_mode_cursor]
text = "#111317"
cursor = "#89b4fa"

[colors.selection]
text = "#111317"
background = "#89b4fa"

[colors.search.matches]
foreground = "#1e1e2e"
background = "#a6adc8"

[colors.search.focused_match]
foreground = "#111317"
background = "#89b4fa"

[colors.normal]
black = "#45475a"
red = "#f38ba8"
green = "#a6e3a1"
yellow = "#f9e2af"
blue = "#89b4fa"
magenta = "#f5c2e7"
cyan = "#94e2d5"
white = "#bac2de"

[colors.bright]
black = "#585b70"
red = "#f38ba8"
green = "#a6e3a1"
yellow = "#f9e2af"
blue = "#89b4fa"
magenta = "#f5c2e7"
cyan = "#94e2d5"
white = "#a6adc8"
