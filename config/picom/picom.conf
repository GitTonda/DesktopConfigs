# ==============================================================================
# Picom Configuration - Modern Smooth Compositor
# ==============================================================================

backend = "glx";
vsync = true;

# ==============================================================================
# Shadows
# ==============================================================================
shadow = true;
shadow-radius = 14;
shadow-opacity = 0.35;
shadow-offset-x = -14;
shadow-offset-y = -14;
shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'Conky'",
  "class_g ?= 'Notify-osd'",
  "class_g = 'Cairo-clock'",
  "class_g = 'Polybar'",
  "_GTK_FRAME_EXTENTS@"
];

# ==============================================================================
# Fading
# ==============================================================================
fading = true;
fade-in-step = 0.04;
fade-out-step = 0.04;
fade-delta = 5;

# ==============================================================================
# Corners
# ==============================================================================
corner-radius = 8;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'Polybar'"
];

# ==============================================================================
# Opacity & Blur
# ==============================================================================
inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 1.0;

# Window type settings
wintypes:
{
  tooltip = { fade = true; shadow = true; opacity = 0.95; focus = true; full-shadow = false; };
  dock = { shadow = false; clip-shadow-above = true; }
  dnd = { shadow = false; }
  popup_menu = { opacity = 0.98; }
  dropdown_menu = { opacity = 0.98; }
};
