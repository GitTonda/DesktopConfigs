# ==============================================================================
# Picom Configuration - Modern Smooth Compositor (Dual-Kawase Blur & Animations)
# ==============================================================================

backend = "glx";
vsync = true;

# ==============================================================================
# Shadows
# ==============================================================================
shadow = true;
shadow-radius = 18;
shadow-opacity = 0.45;
shadow-offset-x = -18;
shadow-offset-y = -18;
shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'Conky'",
  "class_g ?= 'Notify-osd'",
  "class_g = 'Cairo-clock'",
  "class_g = 'Polybar'",
  "class_g = 'slop'",
  "class_i = 'slop'",
  "name = 'slop'",
  "_GTK_FRAME_EXTENTS@:c"
];

# ==============================================================================
# Fading & Animations
# ==============================================================================
fading = true;
fade-in-step = 0.05;
fade-out-step = 0.05;
fade-delta = 5;
no-fading-openclose = false;

# ==============================================================================
# Corners (Crisp Squared Aesthetic)
# ==============================================================================
corner-radius = 0;
rounded-corners-exclude = [];

# ==============================================================================
# Dual-Kawase Background Blurring
# ==============================================================================
blur-method = "dual_kawase";
blur-strength = 7;
blur-background = true;
blur-background-frame = false;
blur-background-fixed = false;
blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'slop'",
  "class_i = 'slop'",
  "name = 'slop'",
  "_GTK_FRAME_EXTENTS@:c"
];

# ==============================================================================
# Opacity Rules
# ==============================================================================
inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 1.0;

# Window type settings
wintypes:
{
  tooltip = { fade = true; shadow = true; opacity = 0.95; focus = true; full-shadow = false; };
  dock = { shadow = false; clip-shadow-above = true; };
  dnd = { shadow = false; };
  popup_menu = { opacity = 0.98; };
  dropdown_menu = { opacity = 0.98; };
};
